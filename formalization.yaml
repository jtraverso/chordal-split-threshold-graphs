      status: "proved"
    - source: "Dirac (1961): a nonempty finite chordal graph has a simplicial vertex"
      lean: "ChordalClasses.exists_isSimplicial"
      module: "Challenge"
      status: "proved"
    - source: "Dirac (1961): two non-adjacent simplicial vertices in a connected non-complete chordal graph"
      lean: "ChordalClasses.exists_two_nonadj_isSimplicial"
      module: "Challenge"
      status: "proved"
    - source: "Fulkerson–Gross (1965): chordal iff perfect elimination order"
      lean: "ChordalClasses.isChordal_iff_exists_isPEO"
      module: "Challenge"
      status: "proved"
    - source: "Gavril (1974): chordal iff intersection graph of subtrees of a tree"
      lean: "ChordalClasses.isChordal_iff_nonempty_subtreeRepresentation"
      module: "Challenge"
      status: "proved"
    - source: "Clique number at most treewidth plus one"
      lean: "ChordalClasses.cliqueNum_le_treewidth_succ"
      module: "Challenge"
      status: "proved"
    - source: "Chordal graphs have treewidth equal to clique number minus one"
      lean: "ChordalClasses.treewidth_succ_eq_cliqueNum"
      module: "Challenge"
      status: "proved"
    - source: "Földes–Hammer (1977): split iff graph and complement chordal"
