version: "v0.4"

project:
  name: "Chordal, split, threshold and cograph structure"
  description: >-
    A Lean 4 / Mathlib formalization of classical structure theorems for finite simple graphs.
    Chordal graphs: every minimal a–b separator is a clique, a nonempty finite chordal graph has a
    simplicial vertex, and a connected non-complete one has two non-adjacent simplicial vertices
    (Dirac 1961); a finite graph is chordal iff it has a perfect elimination order
    (Fulkerson–Gross 1965), iff it is the intersection graph of subtrees of a finite tree (Gavril
    1974); a nonempty finite chordal graph has treewidth ω − 1, and every finite graph has
    ω ≤ tw + 1. Split graphs: split iff the graph and its complement are chordal, iff no induced
    2K₂, C₄ or C₅ (Földes–Hammer 1977). Threshold graphs: threshold iff no induced 2K₂, C₄ or P₄
    (Chvátal–Hammer 1977), iff split and a cograph (no induced P₄). Mathlib has none of these
    graph classes; their definitions are stated in the Challenge.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

