fidelity:
  divergences: >-
    Chordal: every cycle (Mathlib's `Walk.IsCycle`) of length at least four has two support
    vertices adjacent by an edge that is not an edge of the cycle. A minimal a–b separator is a set
    avoiding a and b that meets every a–b walk, no proper subset of which does; the separator
    theorem is stated for finite separators. A perfect elimination order is an injective ranking
    V → ℕ in which the later neighbours of each vertex form a clique. A subtree representation is a
    finite tree with a connected set of nodes for each vertex, distinct vertices being adjacent iff
    their sets meet. Treewidth is the least width (largest bag minus one) of a tree decomposition
    over a finite tree (Pflueger's definition); the clique number is Mathlib's `cliqueNum`. A split
    partition partitions the vertices into a clique and an independent set; threshold graphs are
    split graphs admitting a split partition whose independent vertices have nested neighbourhoods
    (an equivalent form of Chvátal–Hammer's definition); cographs are graphs with no induced
    four-vertex path. Forbidden induced subgraphs use Mathlib's `IsIndContained`, with
    2K₂ = K₂ ⊕ K₂, C₄, C₅ = `cycleGraph 4`, `cycleGraph 5` and P₄ = `pathGraph 4`. Finite vertex sets
    are assumed where the classical statements are about finite graphs.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements and definitions with the cited theorems, checked that the Challenge
    definitions are verbatim copies of the library's, and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution declarations
    that the proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The library
    was reviewed and merged in Lean Pool. The author directed the work and approved the
    statements. No independent human mathematical review has been performed. The results are
    classical; no mathematical novelty is claimed.

